<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Drowsiness Detection System</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Driver Drowsiness Detection System</h1>
            <p>Real-time Driver Drowsiness Detection using MobileNetV2 and Dlib Facial Landmarks</p>
        </header>

        <main>
            <div class="webcam-section glass-panel">
                <div class="video-container">
                    <video id="webcam" autoplay playsinline></video>
                    <div id="alert-banner" class="alert-banner no-face">No Face Detected</div>
                </div>
                <div class="camera-status">
                    <span id="cam-status-dot" class="dot red"></span>
                    <span id="cam-status-text">Camera Disconnected</span>
                </div>
            </div>

            <div class="detection-panel glass-panel">
                <h2>Detection Panel</h2>
                
                <div class="metric-grid">
                    <div class="metric-card">
                        <span class="metric-label">Prediction</span>
                        <span class="metric-value highlight" id="val-prediction">-</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Confidence</span>
                        <span class="metric-value" id="val-confidence">- %</span>
                    </div>
                </div>

                <div class="metric-grid features">
                    <div class="metric-card">
                        <span class="metric-label">EAR</span>
                        <span class="metric-value" id="val-ear">-</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">MAR</span>
                        <span class="metric-value" id="val-mar">-</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Pitch</span>
                        <span class="metric-value" id="val-pitch">-</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Yaw</span>
                        <span class="metric-value" id="val-yaw">-</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Roll</span>
                        <span class="metric-value" id="val-roll">-</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const alertBanner = document.getElementById('alert-banner');
        const camStatusDot = document.getElementById('cam-status-dot');
        const camStatusText = document.getElementById('cam-status-text');

        const valPrediction = document.getElementById('val-prediction');
        const valConfidence = document.getElementById('val-confidence');
        const valEar = document.getElementById('val-ear');
        const valMar = document.getElementById('val-mar');
        const valPitch = document.getElementById('val-pitch');
        const valYaw = document.getElementById('val-yaw');
        const valRoll = document.getElementById('val-roll');

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        const alarmSound = new Audio('/static/alarm.mp3');
        alarmSound.loop = true;

        let isProcessing = false;
        let cameraActive = false;

        const FRAME_INTERVAL = 700;
        const MAX_WIDTH = 640;

        function setBanner(text, className) {
            alertBanner.textContent = text;
            alertBanner.classList.remove('no-face', 'danger', 'normal', 'error');
            alertBanner.classList.add(className);
        }

        function stopAlarm() {
            alarmSound.pause();
            alarmSound.currentTime = 0;
        }

        function updateUI(data) {
            valPrediction.textContent = data.prediction ?? '-';

            valConfidence.textContent =
                Number.isFinite(Number(data.confidence))
                    ? Number(data.confidence).toFixed(2) + ' %'
                    : '- %';

            valEar.textContent =
                Number.isFinite(Number(data.ear))
                    ? Number(data.ear).toFixed(3)
                    : '-';

            valMar.textContent =
                Number.isFinite(Number(data.mar))
                    ? Number(data.mar).toFixed(3)
                    : '-';

            valPitch.textContent =
                Number.isFinite(Number(data.pitch))
                    ? Number(data.pitch).toFixed(2)
                    : '-';

            valYaw.textContent =
                Number.isFinite(Number(data.yaw))
                    ? Number(data.yaw).toFixed(2)
                    : '-';

            valRoll.textContent =
                Number.isFinite(Number(data.roll))
                    ? Number(data.roll).toFixed(2)
                    : '-';

            switch (data.prediction) {
                case 'No Face Detected':
                    setBanner('No Face Detected', 'no-face');
                    stopAlarm();
                    break;

                case 'Wake Up!':
                    setBanner('Wake Up!', 'danger');

                    if (alarmSound.paused) {
                        alarmSound.play().catch(error => {
                            console.warn('Audio playback blocked:', error);
                        });
                    }
                    break;

                case 'Yawn Detected':
                    setBanner('Yawn Detected', 'danger');
                    stopAlarm();
                    break;

                case 'Normal':
                    setBanner('Normal', 'normal');
                    stopAlarm();
                    break;

                default:
                    setBanner(data.prediction || 'Unknown', 'normal');
                    stopAlarm();
            }
        }


        async function initCamera() {
            try {
                if (!navigator.mediaDevices?.getUserMedia) {
                    throw new Error('Camera API is not supported by this browser.');
                }

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    },
                    audio: false
                });

                // Tunggu metadata sebelum mulai memproses frame
                const metadataReady = new Promise(resolve => {
                    if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
                        resolve();
                    } else {
                        video.addEventListener('loadedmetadata', resolve, {
                            once: true
                        });
                    }
                });

                video.srcObject = stream;
                await video.play();
                await metadataReady;

                const width = video.videoWidth;
                const height = video.videoHeight;

                if (!width || !height) {
                    throw new Error('Camera dimensions are unavailable.');
                }

                const scale = Math.min(MAX_WIDTH / width, 1);
                canvas.width = Math.round(width * scale);
                canvas.height = Math.round(height * scale);

                cameraActive = true;

                camStatusDot.classList.remove('red');
                camStatusDot.classList.add('green');
                camStatusText.textContent = 'Camera Active';

                console.log('Camera active:', width, height);
                console.log('Starting frame processing...');

                processFrame();

            } catch (error) {
                console.error('Error accessing webcam:', error);

                cameraActive = false;
                camStatusDot.classList.remove('green');
                camStatusDot.classList.add('red');
                camStatusText.textContent = 'Camera Access Denied';

                setBanner('Camera unavailable', 'error');
            }
        }

        async function processFrame() {
            if (!cameraActive || isProcessing) return;

            isProcessing = true;

            try {
                if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                    return;
                }

                ctx.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                const base64Img = canvas.toDataURL('image/jpeg', 0.7);

                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        image: base64Img
                    })
                });

                const responseText = await response.text();

                let data = {};

                try {
                    data = responseText ? JSON.parse(responseText) : {};
                } catch (error) {
                    console.error("Invalid server response:", responseText);
                }

                if (!response.ok) {
                    throw new Error(
                        data.error || `Server error: ${response.status}`
                    );
                }
                updateUI(data);

            } catch (error) {
                console.error('Prediction request failed:', error);
                valPrediction.textContent = 'Connection Error';
                setBanner('Detection unavailable', 'error');
                stopAlarm();

            } finally {
                isProcessing = false;

                if (cameraActive) {
                    setTimeout(processFrame, FRAME_INTERVAL);
                }
            }
        }

        window.addEventListener('load', initCamera);

        window.addEventListener('beforeunload', () => {
            cameraActive = false;
            stopAlarm();

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
