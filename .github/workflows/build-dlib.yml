name: Build dlib wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libwebp-dev \
            libjpeg-dev \
            libpng-dev \
            libopenblas-dev \
            liblapack-dev
            patchelf

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel --no-deps dlib==20.0.0 \
            --wheel-dir wheelhouse
      - name: Repair wheel
        run: |
          python -m pip install auditwheel
          auditwheel show wheelhouse/*.whl
          auditwheel repair wheelhouse/*.whl \
            --wheel-dir repaired

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: dlib-wheel-repaired
          path: repaired/*.whl